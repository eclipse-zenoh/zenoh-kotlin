# This crate builds nothing that ships. It exists so that the zenoh-flat-jni
# commit this SDK is tested against is recorded in a Cargo.lock, which is the
# artifact eclipse-zenoh/ci's lockfile sync knows how to move: it overwrites the
# lockfile with zenoh's, and resolving this manifest again writes back the
# current zenoh-flat-jni commit. The Gradle build reads that commit out of
# Cargo.lock and checks it out; see CI.md.
#
# It sits at the repository root so this repository is an ordinary dependant of
# that workflow rather than a special case in it.
[package]
name = "zenoh-flat-jni-pin"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# Out of the way: the repository root is a Gradle project.
path = "ci/pin.rs"

[dependencies]
# No features: the pin must resolve the same way the real build does, and the
# real build is zenoh-flat-jni's own `cargo build`.
zenoh-flat-jni = { git = "https://github.com/eclipse-zenoh/zenoh-flat-jni.git", branch = "main" }
